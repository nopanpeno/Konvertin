# Satu wadah API + worker. Jalankan: docker compose up --build
# Sandbox: wadah non-root, filesystem root read-only, tanpa kemampuan tambahan, batas memori dan CPU.
# Tanpa akses internet keluar: di produksi, taruh wadah di jaringan Docker bertipe internal
# di belakang reverse proxy (Caddy/nginx) yang berada di jaringan publik.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: "http://localhost:8080"
      TRUST_PROXY: "0"
    volumes: ["konvertin-data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
volumes:
  konvertin-data:
