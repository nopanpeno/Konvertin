# Sandbox: tanpa akses jaringan keluar untuk konversi.
# Catatan: container ini menerima upload dari luar lewat port 8000, tapi tidak punya rute keluar (network internal + proxy masuk).
services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    environment:
      KONVERTIN_ADMIN_EMAIL: ${KONVERTIN_ADMIN_EMAIL:-}
      KONVERTIN_ADMIN_PASSWORD: ${KONVERTIN_ADMIN_PASSWORD:-}
      KONVERTIN_ADMIN_NAME: ${KONVERTIN_ADMIN_NAME:-Admin Konvertin}
      KONVERTIN_GOOGLE_CLIENT_ID: ${KONVERTIN_GOOGLE_CLIENT_ID:-}
      KONVERTIN_GOOGLE_CLIENT_SECRET: ${KONVERTIN_GOOGLE_CLIENT_SECRET:-}
      KONVERTIN_MIDTRANS_SERVER_KEY: ${KONVERTIN_MIDTRANS_SERVER_KEY:-}
      KONVERTIN_MIDTRANS_CLIENT_KEY: ${KONVERTIN_MIDTRANS_CLIENT_KEY:-}
      KONVERTIN_MIDTRANS_IS_PRODUCTION: ${KONVERTIN_MIDTRANS_IS_PRODUCTION:-0}
      KONVERTIN_XENDIT_WEBHOOK_TOKEN: ${KONVERTIN_XENDIT_WEBHOOK_TOKEN:-}
      KONVERTIN_SESSION_COOKIE_SECURE: ${KONVERTIN_SESSION_COOKIE_SECURE:-1}
      KONVERTIN_PUBLIC_BASE_URL: ${KONVERTIN_PUBLIC_BASE_URL:-}
      KONVERTIN_SMTP_HOST: ${KONVERTIN_SMTP_HOST:-}
      KONVERTIN_SMTP_PORT: ${KONVERTIN_SMTP_PORT:-587}
      KONVERTIN_SMTP_USERNAME: ${KONVERTIN_SMTP_USERNAME:-}
      KONVERTIN_SMTP_PASSWORD: ${KONVERTIN_SMTP_PASSWORD:-}
      KONVERTIN_SMTP_FROM_EMAIL: ${KONVERTIN_SMTP_FROM_EMAIL:-}
      KONVERTIN_SMTP_FROM_NAME: ${KONVERTIN_SMTP_FROM_NAME:-Konvertin}
      KONVERTIN_SMTP_USE_SSL: ${KONVERTIN_SMTP_USE_SSL:-0}
      KONVERTIN_SMTP_STARTTLS: ${KONVERTIN_SMTP_STARTTLS:-1}
    volumes: ["konvertin-data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 2
    networks: [internal]
networks:
  internal: { internal: true }   # tidak ada akses internet keluar. Pasang reverse proxy (Caddy/Nginx) di jaringan lain untuk HTTPS masuk.
volumes:
  konvertin-data:
